name: rimnam_chanthabun
description: "แอปพลิเคชันประสบการณ์ท่องเที่ยวริมน้ำจันทบูรแบบ Interactive + Mission-based"

# ป้องกันไม่ให้เผลออัปโหลดขึ้น pub.dev
publish_to: 'none' 

version: 1.0.0+1

environment:
  # รองรับ Dart 3 ขึ้นไป
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management & Storage ---
  flutter_riverpod: ^2.4.9        # สำหรับจัดการ State และ Localization แบบ Reactive
  shared_preferences: ^2.2.2      # สำหรับเซฟภาษาและสถานะภารกิจลงเครื่อง
  
  # --- Map & Location ---
  flutter_map: ^7.0.2             # แผนที่ OSM ฟรี ไม่ต้องใช้ API key
  latlong2: ^0.9.0                # LatLng type สำหรับ flutter_map
  geolocator: ^13.0.1             # GPS tracking บนทุก platform
  url_launcher: ^6.3.1            # เปิด Google Maps นำทาง
  image_picker: ^1.1.2            # เปิดกล้องจริง + จัดการ permission อัตโนมัติ
  camera: ^0.11.0                 # Camera preview แบบ in-app
  flutter_map_tile_caching: ^10.0.0 # Offline tile caching
  http: ^1.2.1

  # --- UI & Design ---
  google_fonts: ^6.1.0            # สำหรับโหลด Noto Serif Thai และ Playfair Display อัตโนมัติ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/icons/

  fonts:
     - family: Noto Serif Thai
       fonts:
         - asset: assets/fonts/NotoSerifThai-Regular.ttf
         - asset: assets/fonts/NotoSerifThai-Bold.ttf
           weight: 700
     - family: Playfair Display
       fonts:
         - asset: assets/fonts/CormorantGaramond-Regular.ttf
         - asset: assets/fonts/CormorantGaramond-Bold.ttf
           weight: 700